<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>다봐요 Studio</title>
<style>
  :root{
    --bg:#080b11; --panel:#10151f; --panel2:#0d121b; --elev:#161d2b;
    --line:#212a3c; --line2:#2c3750;
    --ink:#e9eefb; --mut:#8a99b8; --mut2:#62708d;
    --acc:#5cc8ff; --acc-ink:#04121f; --brand:#ea1834;
    --ok:#54e0b0; --warn:#ffcf6b; --danger:#ff7a8a;
    --r:10px; --r-sm:7px; --r-lg:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:13.5px/1.45 -apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;
       background:var(--bg);color:var(--ink);overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#26314a;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#33405e}
  a{color:var(--acc);text-decoration:none}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;
         border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141a28,#0c1018)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand)}
  .brand b{color:var(--acc)}
  .hgroup{display:flex;align-items:center;gap:8px}
  .hgroup.proj{min-width:280px}
  header .sp{flex:1}
  .store{font-size:11px;color:var(--mut2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}

  /* ---------- buttons / inputs ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
       background:var(--elev);color:var(--ink);border:1px solid var(--line2);border-radius:var(--r-sm);
       padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
  .btn:hover{border-color:#41507a;filter:brightness(1.12)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.icon{padding:6px 9px}
  .btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
  .btn.brand{background:var(--brand);color:#fff;border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.danger{background:#37161f;color:var(--danger);border-color:#4a2330}
  .btn.block{width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  label{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
        border-radius:var(--r-sm);padding:7px 9px;font:inherit;outline:none;transition:.12s}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(92,200,255,.15)}
  textarea{resize:vertical;min-height:54px;font-family:ui-monospace,monospace;font-size:12px}
  .row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
  .field{margin-bottom:10px}

  /* ---------- app grid ---------- */
  .app{display:grid;height:calc(100vh - 53px);
       grid-template-columns:268px minmax(0,1fr) 316px;
       grid-template-rows:minmax(0,1fr) 196px;
       grid-template-areas:"tools stage inspector" "tools timeline inspector"}
  .panel{background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
  .tools{grid-area:tools;border-right:1px solid var(--line)}
  .stage-wrap{grid-area:stage;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .inspector{grid-area:inspector;border-left:1px solid var(--line);background:var(--panel2)}
  .timeline{grid-area:timeline;border-top:1px solid var(--line);border-right:1px solid var(--line);
            background:var(--panel2);display:flex;flex-direction:column}

  /* ---------- tabs ---------- */
  .tabbar{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);background:var(--panel)}
  .tabbtn{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);
          padding:9px 4px;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer;border-radius:6px 6px 0 0}
  .tabbtn:hover{color:var(--ink);background:#131a28}
  .tabbtn.on{color:var(--acc);border-bottom-color:var(--acc)}
  .tabbody{flex:1;overflow:auto;padding:14px}
  .tabpane{display:none}
  .tabpane.on{display:block;animation:fade .15s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut2);margin:0 0 10px}
  .card{background:var(--elev);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:13px}
  .hint{font-size:11.5px;color:var(--mut2);line-height:1.5}

  /* ---------- preview stage ---------- */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
         background:radial-gradient(circle at 50% 40%,#0d1320,#05070c);position:relative}
  .stage img,.stage video{max-width:96%;max-height:96%;border-radius:8px;
         box-shadow:0 8px 40px rgba(0,0,0,.55);background:#000}
  .stage .empty{color:var(--mut2);text-align:center;padding:30px}
  .stage .empty .big{font-size:15px;color:var(--mut);margin-bottom:6px}
  .badge{position:absolute;top:12px;left:12px;font-size:11px;color:var(--mut);
         background:rgba(8,11,17,.7);border:1px solid var(--line);padding:3px 9px;border-radius:20px}
  #ovl{position:absolute;inset:0;pointer-events:none;z-index:4}
  .handle{position:absolute;transform:translate(-50%,-50%);min-width:28px;height:28px;padding:0 6px;
          border-radius:16px;background:rgba(92,200,255,.22);border:2px solid var(--acc);color:#dff3ff;
          display:flex;align-items:center;justify-content:center;font-size:13px;cursor:grab;
          pointer-events:auto;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.4);user-select:none}
  .handle:hover{background:rgba(92,200,255,.35)}
  .handle:active{cursor:grabbing}
  .handle .lbl{font-size:11px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .transport{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);
             background:var(--panel)}
  .transport .t{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut);min-width:74px}
  .transport input[type=range]{flex:1;accent-color:var(--acc);cursor:pointer}
  .rinfo{font-size:11.5px;color:var(--mut);padding:0 16px 9px;background:var(--panel);min-height:0}

  /* ---------- timeline ---------- */
  .tl-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
           font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut2)}
  .tl-head .dur{color:var(--mut);text-transform:none;letter-spacing:0}
  .tl-body{position:relative;flex:1;overflow:auto;padding:8px 0}
  .tl-row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;padding:3px 12px}
  .tl-label{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-lane{position:relative;height:34px;background:var(--panel);border:1px solid var(--line);
           border-radius:7px;overflow:hidden}
  .tl-clip{position:absolute;height:24px;border-radius:5px;display:flex;align-items:center;
           padding:0 9px;font-size:11px;color:#04121f;font-weight:600;cursor:grab;overflow:hidden;
           box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:filter .1s}
  .tl-clip:active{cursor:grabbing}
  .tl-clip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;flex:1}
  .tl-clip:hover{filter:brightness(1.1)}
  .tl-clip.sel{box-shadow:inset 0 0 0 2px #fff,0 2px 10px rgba(0,0,0,.4);z-index:2}
  .tl-grip{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
  .tl-grip.l{left:0;border-radius:5px 0 0 5px}.tl-grip.r{right:0;border-radius:0 5px 5px 0}
  .tl-grip:hover{background:rgba(255,255,255,.4)}
  .tl-lane.drophover{box-shadow:inset 0 0 0 2px var(--acc);background:#13243a}
  .guide{position:absolute;background:var(--warn);box-shadow:0 0 6px var(--warn);pointer-events:none;z-index:5}
  .guide.v{width:1px}.guide.h{height:1px}
  .tl-rulerrow{height:20px}
  .tl-ruler{position:relative;height:18px;border-bottom:1px dashed var(--line)}
  .tl-ruler .tick{position:absolute;top:0;font-size:10px;color:var(--mut2);transform:translateX(-1px);
                  border-left:1px solid var(--line);padding-left:3px;height:14px}
  .ctxmenu{position:fixed;display:none;z-index:100;background:var(--elev);border:1px solid var(--line2);
           border-radius:9px;padding:5px;min-width:150px;box-shadow:0 12px 36px rgba(0,0,0,.55)}
  .ctxitem{padding:8px 11px;border-radius:6px;font-size:13px;cursor:pointer}
  .ctxitem:hover{background:#1d2640}
  .ctxitem.dz{color:var(--danger)}
  .ctxsep{height:1px;background:var(--line);margin:4px 6px}
  .tl-empty{color:var(--mut2);font-size:12px;padding:22px 14px;text-align:center}
  .tl-playhead{position:absolute;top:0;width:2px;background:var(--brand);box-shadow:0 0 8px var(--brand);
               pointer-events:none;display:none;z-index:3}
  .tl-playhead:before{content:'';position:absolute;top:-1px;left:-4px;border:5px solid transparent;
               border-top-color:var(--brand)}

  /* ---------- inspector / chat ---------- */
  .pill{font-size:11px;color:var(--mut)}
  .clip-meta{display:inline-block;background:#1b2438;color:var(--acc);border-radius:5px;
             padding:2px 7px;font-size:11px;margin-bottom:10px}
  .chat{display:flex;flex-direction:column;height:100%}
  .chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:2px}
  .bub{max-width:88%;padding:8px 11px;border-radius:11px;font-size:12.5px;white-space:pre-wrap}
  .bub.u{align-self:flex-end;background:#1d2b4a;color:#dfe8fb}
  .bub.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .chatin{display:flex;gap:8px;margin-top:10px}
  .empty-i{color:var(--mut2);font-size:12.5px;text-align:center;padding:26px 10px}

  /* ---------- misc ---------- */
  .switch{position:relative;width:36px;height:20px;flex:0 0 auto}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:#26304a;border-radius:20px;transition:.2s;cursor:pointer}
  .slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+.slider{background:var(--ok)}
  .switch input:checked+.slider:before{transform:translateX(16px)}
  .toast{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);background:var(--elev);
         border:1px solid var(--line2);padding:9px 16px;border-radius:9px;opacity:0;transition:.2s;
         pointer-events:none;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <span class="brand"><span class="dot"></span>다봐요 <b>Studio</b></span>
  <div class="hgroup proj">
    <select id="proj" style="flex:1"></select>
    <button class="btn icon sm ghost" onclick="renameProject()" title="이름 변경">✎</button>
    <button class="btn icon sm ghost" onclick="duplicateProject()" title="복제">⧉</button>
    <button class="btn icon sm ghost" onclick="deleteProject()" title="삭제">🗑</button>
    <button class="btn icon sm ghost" onclick="refreshProjects()" title="새로고침">↻</button>
    <button class="btn sm" onclick="createProject()">+ 새 프로젝트</button>
  </div>
  <span class="sp"></span>
  <span class="store" id="store"></span>
  <label class="live">동기화<span class="switch"><input type="checkbox" id="live" checked><span class="slider"></span></span></label>
  <button class="btn brand" id="renderBtn" onclick="doRender()">▶ 렌더</button>
</header>

<div class="app">
  <!-- ===== LEFT: tools ===== -->
  <div class="panel tools">
    <div class="tabbar">
      <button class="tabbtn on" data-group="tools" data-name="media" onclick="showTab('tools','media')">미디어</button>
      <button class="tabbtn" data-group="tools" data-name="text" onclick="showTab('tools','text')">텍스트</button>
      <button class="tabbtn" data-group="tools" data-name="graphic" onclick="showTab('tools','graphic')">그래픽</button>
      <button class="tabbtn" data-group="tools" data-name="fx" onclick="showTab('tools','fx')">효과</button>
    </div>
    <div class="tabbody">
      <!-- 미디어 -->
      <div class="tabpane on" data-group="tools" data-name="media">
        <div class="sec-title">영상 / 이미지 에셋</div>
        <div class="card">
          <label>등록된 에셋</label>
          <select id="mediaSel"></select>
          <div class="row" style="margin-top:8px">
            <div><label>시작(s)</label><input id="medStart" type="number" step="0.1" value="0"></div>
            <div><label>길이(s)</label><input id="medDur" type="number" step="0.1" value="5"></div>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="btn icon ghost" onclick="loadAssets()" title="에셋 새로고침">↻</button>
            <button class="btn primary" style="flex:2" onclick="addMedia()">＋ 타임라인에 추가</button>
          </div>
        </div>
        <p class="hint">발행/업로드된 영상이 여기 드롭다운에 나타납니다. 골라서 타임라인에 올린 뒤, 텍스트·효과를 얹어 다시 렌더하세요.</p>
      </div>
      <!-- 텍스트 -->
      <div class="tabpane" data-group="tools" data-name="text">
        <div class="sec-title">자막 / 제목</div>
        <div class="card">
          <h3>텍스트</h3>
          <label>내용</label>
          <input id="txt" value="제품 소개">
          <div class="row" style="margin-top:6px">
            <div><label>크기</label><input id="txtSize" type="number" value="90"></div>
            <div><label>색</label><input id="txtColor" value="#ffffff"></div>
          </div>
          <button class="btn block" style="margin-top:10px" onclick="addText()">＋ 텍스트 추가</button>
        </div>
        <div class="card">
          <h3>말풍선 콜아웃</h3>
          <label>내용</label>
          <input id="coTxt" value="이 부분을 설명">
          <div class="row" style="margin-top:6px">
            <div><label>X</label><input id="coX" type="number" value="640"></div>
            <div><label>Y</label><input id="coY" type="number" value="360"></div>
            <div><label>꼬리</label><select id="coSide"><option>bottom</option><option>top</option><option>left</option><option>right</option></select></div>
          </div>
          <button class="btn block" style="margin-top:10px" onclick="addCallout()">＋ 콜아웃 추가</button>
        </div>
      </div>
      <!-- 그래픽 -->
      <div class="tabpane" data-group="tools" data-name="graphic">
        <div class="sec-title">배경 / 그래픽</div>
        <div class="card">
          <h3>배경 그라데이션</h3>
          <div class="row">
            <div><label>시작색</label><input id="bg1" value="#1a2c5e"></div>
            <div><label>끝색</label><input id="bg2" value="#0b0e16"></div>
          </div>
          <button class="btn block" style="margin-top:10px" onclick="addBackground()">＋ 배경 추가</button>
        </div>
      </div>
      <!-- 효과 -->
      <div class="tabpane" data-group="tools" data-name="fx">
        <div class="sec-title">마스터 이펙트</div>
        <div class="card">
          <label>이펙트</label>
          <select id="fx"></select>
          <button class="btn block" style="margin-top:10px" onclick="addEffect()">＋ 이펙트 추가</button>
        </div>
        <p class="hint">선택한 이펙트가 전체 영상(마스터)에 적용됩니다.</p>
      </div>
    </div>
  </div>

  <!-- ===== CENTER: stage ===== -->
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="empty"><div class="big">프로젝트를 선택하거나 만들어 주세요</div>왼쪽 도구로 배경·텍스트·미디어를 추가하고, 아래에서 미리보기·렌더하세요.</div>
    </div>
    <div class="transport">
      <button class="btn icon" id="playBtn" onclick="playToggle()" title="재생/일시정지">▶</button>
      <span class="t" id="tlabel">0.0s</span>
      <input id="time" type="range" min="0" max="10" step="0.1" value="0" oninput="onScrub()">
      <button class="btn sm ghost" onclick="refreshPreview()" title="현재 프레임 새로고침">미리보기</button>
      <button class="btn sm ghost" onclick="undoEdit()" title="마지막 편집 되돌리기">↶ 되돌리기</button>
    </div>
    <div class="rinfo" id="renderInfo"></div>
  </div>

  <!-- ===== RIGHT: inspector ===== -->
  <div class="panel inspector">
    <div class="tabbar">
      <button class="tabbtn on" data-group="insp" data-name="props" onclick="showTab('insp','props')">속성</button>
      <button class="tabbtn" data-group="insp" data-name="ai" onclick="showTab('insp','ai')">AI 채팅</button>
      <button class="tabbtn" data-group="insp" data-name="code" onclick="showTab('insp','code')">코드</button>
    </div>
    <div class="tabbody">
      <!-- 속성 -->
      <div class="tabpane on" data-group="insp" data-name="props">
        <div id="inspectorBody"><div class="empty-i">타임라인에서 클립을 선택하면<br>여기서 편집할 수 있습니다.</div></div>
      </div>
      <!-- AI -->
      <div class="tabpane" data-group="insp" data-name="ai" style="height:100%">
        <div class="chat">
          <div style="margin-bottom:8px"><span class="pill" id="chatStatus"></span></div>
          <div class="chatlog" id="chatLog"></div>
          <div class="chatin">
            <input id="chatIn" placeholder="예: 빨간 제목 '신제품'을 가운데 추가해줘" onkeydown="if(event.key==='Enter')sendChat()">
            <button class="btn primary" id="chatBtn" onclick="sendChat()">전송</button>
          </div>
        </div>
      </div>
      <!-- 코드 -->
      <div class="tabpane" data-group="insp" data-name="code">
        <div class="sec-title">원본 스펙 (JSON)</div>
        <textarea id="rawspec" style="min-height:320px"></textarea>
        <button class="btn block" style="margin-top:8px" onclick="saveSpec()">스펙 저장 (PUT)</button>
      </div>
    </div>
  </div>

  <!-- ===== BOTTOM: timeline ===== -->
  <div class="timeline">
    <div class="tl-head">타임라인 <span class="dur" id="durlabel"></span></div>
    <div class="tl-body" id="tlBody">
      <div id="timelineTracks"></div>
      <div class="tl-playhead" id="playhead"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="ctxmenu" id="ctxmenu"></div>

<script>
const $=s=>document.querySelector(s);
let PID=null, SPEC=null, SEL=null, CAPS=null, ASSETS={}, PLAYING=false;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
function showTab(g,n){
  document.querySelectorAll(`.tabpane[data-group="${g}"]`).forEach(p=>p.classList.toggle('on',p.dataset.name===n));
  document.querySelectorAll(`.tabbtn[data-group="${g}"]`).forEach(b=>b.classList.toggle('on',b.dataset.name===n));
}
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||r.statusText);}
  const ct=r.headers.get('Content-Type')||'';return ct.includes('json')?r.json():r;
}

async function boot(){
  CAPS=await api('GET','/api/capabilities');
  $('#fx').innerHTML=(CAPS.effects||[]).map(e=>`<option>${e}</option>`).join('');
  await refreshProjects();
  await loadAssets();
  chatStatus();
  window.addEventListener('resize',()=>{updatePlayhead();drawHandle();});
  setInterval(()=>{if($('#live').checked&&PID&&!PLAYING)softRefresh();},2500);
}
async function refreshProjects(){
  const {projects}=await api('GET','/api/projects');
  $('#proj').innerHTML=projects.length
    ? projects.map(p=>`<option value="${p.id}">${p.name} · ${(p.resolution||[]).join('×')}</option>`).join('')
    : '<option value="">프로젝트 없음</option>';
  if(projects.length){PID=$('#proj').value=projects[projects.length-1].id;await loadProject();}
  else{PID=null;}
}

function renderTimeline(tracks){

      <div class="tl-lane" data-track="${tr.track}" style="height:${laneH}px">${tr.clips.map((c,ci)=>{
        const left=Math.min(98,Math.max(0,(c.start||0)/dur*100));
        const w=Math.min(100-left,Math.max(3,((c.duration||0)/dur)*100));
        const top=pk.row[ci]*28+2;

// greedy interval packing: overlapping clips get stacked onto separate sub-rows
function packLanes(clips){
  const order=clips.map((c,ci)=>({ci,s:c.start||0,e:(c.start||0)+(c.duration||0)}))
    .sort((a,b)=>a.s-b.s||a.e-b.e);
  const rowEnds=[],row={};
  order.forEach(o=>{let r=rowEnds.findIndex(end=>end<=o.s+1e-6);
    if(r<0){r=rowEnds.length;rowEnds.push(o.e);}else rowEnds[r]=o.e;row[o.ci]=r;});
  return {row,rows:Math.max(1,rowEnds.length)};
}
function rulerHTML(dur){

  for(let t=0;t<=dur+1e-6;t+=step){const left=Math.min(99.5,t/dur*100);
    m+=`<span class="tick" style="left:${left}%">${+t.toFixed(2)}s</span>`;}
  return `<div class="tl-row tl-rulerrow"><div class="tl-label"></div><div class="tl-ruler" id="tlRuler">${m}</div></div>`;
}

let TLD=null;
function wireTimeline(){

    const track=el.dataset.track,index=+el.dataset.index;
    el.querySelector('.tl-grip.l').addEventListener('mousedown',e=>startClipDrag(e,el,'l'));
    el.querySelector('.tl-grip.r').addEventListener('mousedown',e=>startClipDrag(e,el,'r'));
    el.addEventListener('mousedown',e=>{if(e.target.classList.contains('tl-grip'))return;startClipDrag(e,el,'move');});
    el.addEventListener('contextmenu',e=>showCtx(e,track,index));

function collectEdges(track,skip){
  const dur=parseFloat($('#time').max)||10;const out=[0,dur,parseFloat($('#time').value)||0];
  (SPEC.tracks||[]).forEach(tr=>tr.clips.forEach((c,i)=>{
    if(tr.name===track&&i===skip)return;out.push(c.start||0,(c.start||0)+(c.duration||0));}));
  return out;
}
function snapSec(v,edges,thr){let best=v,bd=thr;edges.forEach(e=>{const d=Math.abs(v-e);if(d<bd){bd=d;best=e;}});return best;}
function startClipDrag(e,el,mode){
  e.preventDefault();e.stopPropagation();
  const track=el.dataset.track,index=+el.dataset.index;
  SEL={track,index};showInspector();
  document.querySelectorAll('.tl-clip').forEach(c=>c.classList.toggle('sel',c===el));
  const lr=el.parentElement.getBoundingClientRect();
  const dur=parseFloat($('#time').max)||10;
  // overlap is allowed: text/callout/etc. coexist in time and stack on sub-rows
  TLD={el,mode,track,index,lanePx:lr.width,dur,startX:e.clientX,
       origStart:+el.dataset.start,origDur:+el.dataset.dur,moved:false,
       edges:collectEdges(track,index),srcTrack:track,curTrack:track};
  window.addEventListener('mousemove',onClipDrag);window.addEventListener('mouseup',endClipDrag);

function trackKind(name){const t=SPEC&&SPEC.tracks.find(x=>x.name===name);return t?(t.kind||'video'):'video';}
function onClipDrag(e){
  if(!TLD)return;if(Math.abs(e.clientX-TLD.startX)>2)TLD.moved=true;
  if(TLD.mode==='move'){                          // detect target track under cursor
    let hov=null;document.querySelectorAll('.tl-lane').forEach(l=>{const b=l.getBoundingClientRect();
      if(e.clientY>=b.top&&e.clientY<=b.bottom&&trackKind(l.dataset.track)===trackKind(TLD.srcTrack))hov=l.dataset.track;});
    const tgt=hov||TLD.srcTrack;
    if(tgt!==TLD.curTrack){
      TLD.curTrack=tgt;TLD.moved=true;
      document.querySelectorAll('.tl-lane').forEach(l=>l.classList.toggle('drophover',l.dataset.track===tgt&&tgt!==TLD.srcTrack));
    }
  }
  const sPerPx=TLD.dur/TLD.lanePx,thr=8*sPerPx,min=0.1;
  const delta=(e.clientX-TLD.startX)*sPerPx;
  let start=TLD.origStart,d=TLD.origDur;
  if(TLD.mode==='move'){start=snapSec(TLD.origStart+delta,TLD.edges,thr);start=Math.max(0,Math.min(TLD.dur-d,start));}
  else if(TLD.mode==='r'){let end=snapSec(TLD.origStart+TLD.origDur+delta,TLD.edges,thr);end=Math.min(TLD.dur,end);d=Math.max(min,end-TLD.origStart);}
  else{let ns=snapSec(TLD.origStart+delta,TLD.edges,thr);ns=Math.max(0,Math.min(TLD.origStart+TLD.origDur-min,ns));d=TLD.origStart+TLD.origDur-ns;start=ns;}
  TLD.curStart=Math.round(start*100)/100;TLD.curDur=Math.round(d*100)/100;
  const left=Math.min(98,Math.max(0,TLD.curStart/TLD.dur*100));
  const w=Math.min(100-left,Math.max(1,TLD.curDur/TLD.dur*100));

  const cross=TLD.mode==='move'&&TLD.curTrack!==TLD.srcTrack;
  const b=$('#badge');if(b)b.textContent=(cross?`→ ${TLD.curTrack} · `:'')+`${TLD.curStart.toFixed(2)}s · 길이 ${TLD.curDur.toFixed(2)}s`;
}
async function endClipDrag(){

  if(d.mode==='move'&&d.curTrack&&d.curTrack!==d.srcTrack){
    const src=trackOf(d.srcTrack),tgt=trackOf(d.curTrack);

  const hx=(r.left-s.left)+x/(SPEC.width||1280)*r.width;
  const hy=(r.top-s.top)+y/(SPEC.height||720)*r.height;
  const txt=(clip.element||{}).text;
  ovl.innerHTML=`<div class="handle" id="handle" style="left:${hx}px;top:${hy}px" title="드래그해서 위치 이동">✛${txt?`<span class="lbl">${String(txt).replace(/</g,'&lt;').slice(0,12)}</span>`:''}</div>`;
  $('#handle').onmousedown=startDrag;
}
function hideHandle(){const o=$('#ovl');if(o)o.innerHTML='';}
function startDrag(e){
  e.preventDefault();if(!selectedClip())return;
  DRAG={x:null,y:null};
  window.addEventListener('mousemove',onDrag);
  window.addEventListener('mouseup',endDrag);
}
function onDrag(e){
  if(!DRAG)return;const f=$('#frame');if(!f)return;
  const r=f.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();
  const W=SPEC.width||1280,H=SPEC.height||720;
  let x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  let snapX=null,snapY=null;
  [W/2,0,W].forEach(t=>{if(Math.abs(x-t)<W*0.022){x=t;snapX=t;}});
  [H/2,0,H].forEach(t=>{if(Math.abs(y-t)<H*0.022){y=t;snapY=t;}});
  x=Math.max(0,Math.min(W,Math.round(x)));y=Math.max(0,Math.min(H,Math.round(y)));
  DRAG.x=x;DRAG.y=y;
  const h=$('#handle');
  if(h){h.style.left=((r.left-s.left)+x/W*r.width)+'px';h.style.top=((r.top-s.top)+y/H*r.height)+'px';}
  drawGuides(snapX,snapY,r,s,W,H);
  const X=$('#e_x'),Y=$('#e_y');if(X)X.value=x;if(Y)Y.value=y;
  $('#badge').textContent=`위치 ${x}, ${y}`;
}
function drawGuides(sx,sy,r,s,W,H){
  const ovl=$('#ovl');if(!ovl)return;
  let g=ovl.querySelector('.guides');if(!g){g=document.createElement('div');g.className='guides';ovl.appendChild(g);}
  let html='';
  if(sx!=null)html+=`<div class="guide v" style="left:${(r.left-s.left)+sx/W*r.width}px;top:${r.top-s.top}px;height:${r.height}px"></div>`;
  if(sy!=null)html+=`<div class="guide h" style="top:${(r.top-s.top)+sy/H*r.height}px;left:${r.left-s.left}px;width:${r.width}px"></div>`;
  g.innerHTML=html;
}
function clearGuides(){const ovl=$('#ovl'),g=ovl&&ovl.querySelector('.guides');if(g)g.innerHTML='';}
async function endDrag(){
  window.removeEventListener('mousemove',onDrag);window.removeEventListener('mouseup',endDrag);clearGuides();
  if(!DRAG||DRAG.x==null){DRAG=null;return;}
  const x=DRAG.x,y=DRAG.y;DRAG=null;
  try{await api('PATCH',`/api/projects/${PID}/clips/${SEL.track}/${SEL.index}`,{patch:{transform:{position:[x,y]}}});
    await loadProject();selectClip(SEL.track,SEL.index);toast('위치 이동: '+x+', '+y);
  }catch(err){toast('이동 오류: '+err.message);}
}
function updatePlayhead(){
  const ph=$('#playhead');if(!ph)return;
  const lane=document.querySelector('.tl-lane');const body=$('#tlBody');
  if(!lane||!body){ph.style.display='none';return;}
  const dur=parseFloat($('#time').max)||10,t=parseFloat($('#time').value)||0;
  const lr=lane.getBoundingClientRect(),br=body.getBoundingClientRect();
  ph.style.display='block';
  ph.style.left=(lr.left-br.left+(t/dur)*lr.width)+'px';
  ph.style.height=body.scrollHeight+'px';
}
// ---- lightweight play: step the scrubber, re-rendering preview frames ----
function playToggle(){
  if(PLAYING){stopPlay();return;}
  if(!PID){toast('프로젝트를 먼저 선택하세요');return;}
  PLAYING=true;$('#playBtn').textContent='⏸';hideHandle();ensureStage();
  const step=0.2,max=parseFloat($('#time').max)||10;
  const tick=()=>{
    if(!PLAYING)return;
    let t=parseFloat($('#time').value)+step;if(t>max)t=0;
    $('#time').value=t;$('#tlabel').textContent=t.toFixed(1)+'s';
    const f=$('#frame');if(!f){PLAYING=false;return;}
    f.onload=()=>{if(!PLAYING)return;$('#badge').textContent=t.toFixed(1)+'s · 재생';updatePlayhead();setTimeout(tick,30);};
    f.onerror=()=>{if(PLAYING)setTimeout(tick,150);};
    f.src=`/api/projects/${PID}/preview?t=${t}&_=${Date.now()}`;
  };
  tick();
}
function stopPlay(){PLAYING=false;const b=$('#playBtn');if(b)b.textContent='▶';drawHandle();}
async function doRender(){
  if(!PID){toast('프로젝트를 먼저 선택하세요');return;}
  stopPlay();
  $('#renderBtn').disabled=true;$('#renderBtn').textContent='렌더 중…';$('#renderInfo').textContent='렌더링 중입니다…';
  try{const r=await api('POST','/api/projects/'+PID+'/render',{});
    $('#stage').innerHTML=`<video src="${r.url}?_=${Date.now()}" controls autoplay loop></video><span class="badge">렌더 결과</span>`;
    $('#renderInfo').textContent=`완료 · ${r.frames}프레임 · ${r.render_seconds}s · ${(r.bytes/1e6).toFixed(1)}MB`;
  }catch(e){$('#renderInfo').textContent='오류: '+e.message;toast('렌더 오류');}
  $('#renderBtn').disabled=false;$('#renderBtn').textContent='▶ 렌더';
}
function chatBubble(role,text){
  const d=document.createElement('div');d.className='bub '+(role==='user'?'u':'a');
  d.textContent=text;$('#chatLog').appendChild(d);$('#chatLog').scrollTop=1e9;return d;
}
async function chatStatus(){
  try{const s=await api('GET','/api/chat/status');
    const mcp=s.mcp_connected?('MCP '+s.mcp_tools+'개 도구'):'MCP 미연결';
    $('#chatStatus').textContent=s.available?('● '+mcp+' · '+s.provider+' '+(s.model||'')):('○ '+mcp+' · LLM 미설정');
    $('#chatStatus').style.color=s.available?'var(--ok)':'var(--mut)';
    $('#chatStatus').title=s.hint||'';}catch(e){}
}
async function undoEdit(){
  if(!PID)return;const r=await api('POST','/api/projects/'+PID+'/undo',{});
  if(r.ok){await loadProject();toast('되돌림 ('+r.remaining+' 남음)');}else{toast('되돌릴 항목 없음');}
}
async function sendChat(){
  const inp=$('#chatIn');const msg=inp.value.trim();if(!msg||!PID)return;
  inp.value='';chatBubble('user',msg);
  const thinking=chatBubble('assistant','…편집 중');$('#chatBtn').disabled=true;
  try{const r=await api('POST','/api/projects/'+PID+'/chat',{message:msg});
    thinking.textContent=r.reply+(r.actions&&r.actions.length?`  [${r.actions.map(a=>a.name).join(', ')}]`:'');
    await loadProject();
  }catch(e){thinking.textContent='오류: '+e.message;}
  $('#chatBtn').disabled=false;inp.focus();
}
boot();
</script>
