<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다봐요 · Sheets</title>
<style>
  :root{ --bg:#0b0e16; --fg:#eef2fa; --muted:#8b93a7; --card:#141926; --line:#232a3b; --accent:#6aa0ff; --thumb:#1c2333; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --fg:#111726; --muted:#5b647a; --card:#fff; --line:#e3e8f2; --accent:#2f6bff; --thumb:#eef1f8; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; padding:22px 18px 80px; }
  header{ display:flex; align-items:center; gap:10px; max-width:1180px; margin:0 auto 18px; }
  header .logo{ font-weight:700; } header .badge{ font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  .wrap{ max-width:1180px; margin:0 auto; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:16px; }
  .panel h2{ font-size:15px; margin:0 0 12px; display:flex; justify-content:space-between; align-items:baseline; }
  .panel h2 .n{ color:var(--muted); font-weight:400; font-size:12px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .card{ border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; background:var(--bg); transition:border-color .15s; }
  .card:hover{ border-color:var(--accent); }
  .card.sel{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .card .thumb{ width:100%; aspect-ratio:1/1; background:var(--thumb); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .card .cap{ padding:7px 9px; }
  .card .cap .nm{ font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .cap .ch{ color:var(--muted); font-size:11px; }
  .form{ margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; }
  input, select, textarea{ background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; font-size:13px; }
  input.grow{ flex:1; min-width:110px; }
  button{ background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  button.ghost{ background:transparent; color:var(--fg); border:1px solid var(--line); }
  .muted{ color:var(--muted); font-size:13px; }
  /* detail */
  #detail .variants{ display:flex; flex-direction:column; gap:8px; margin:8px 0; }
  .variant{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .variant .vh{ font-weight:600; font-size:13px; }
  .variant .vf{ color:var(--muted); font-size:12px; }
  .refs{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .refs img, .refs .noimg{ width:48px; height:48px; border-radius:6px; object-fit:cover; background:var(--thumb); border:1px solid var(--line); }
  /* storyboard */
  .shot{ border-top:1px solid var(--line); padding:12px 0; }
  .shot:first-of-type{ border-top:0; }
  .shot .p{ font-size:13.5px; } .shot .meta{ color:var(--muted); font-size:12px; margin-top:2px; }
  .bindrow{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .bound{ color:var(--accent); font-size:12px; }
  .resolved{ margin-top:8px; font-size:12.5px; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; white-space:pre-wrap; display:none; }
  a{ color:var(--accent); }
</style>
</head>
<body>
  <header>
    <span class="logo">다봐요</span><span class="badge">Sheets</span>
    <span class="muted" id="projHint" style="margin-left:auto"></span>
  </header>

  <div class="wrap">
    <div class="grid">
      <div class="panel">
        <h2>캐릭터 <span class="n" id="charN"></span></h2>
        <div class="cards" id="charCards"><span class="muted">불러오는 중…</span></div>
        <div class="form">
          <input class="grow" id="charName" placeholder="이름 (예: Mina)">
          <input class="grow" id="charDesc" placeholder="설명 (예: late-20s, dark bob)">
          <button onclick="createRef('character')">추가</button>
        </div>
      </div>
      <div class="panel">
        <h2>환경 <span class="n" id="envN"></span></h2>
        <div class="cards" id="envCards"><span class="muted">불러오는 중…</span></div>
        <div class="form">
          <input class="grow" id="envName" placeholder="이름 (예: City apartment)">
          <input class="grow" id="envDesc" placeholder="설명 (예: high-rise, windows)">
          <button onclick="createRef('environment')">추가</button>
        </div>
      </div>
    </div>

    <div class="panel" id="detail" style="display:none"></div>

    <div class="panel" id="sbPanel" style="display:none">
      <h2>스토리보드 <span class="n" id="sbN"></span></h2>
      <div id="sbList" class="muted">—</div>
      <div class="form">
        <input class="grow" id="shotPrompt" placeholder="샷 액션 (예: she looks to the light)">
        <input id="shotDur" type="number" min="0.5" step="0.5" value="4" style="width:76px">
        <select id="shotMode"><option>t2v</option><option>i2v</option></select>
        <button onclick="addShot()">샷 추가</button>
      </div>
    </div>
  </div>

<script>
var PROJECT = new URLSearchParams(location.search).get("project") || "";
var LIB = {character:[], environment:[]};   // cached for pickers
function j(url, opts){ return fetch(url, opts).then(function(r){ return r.ok ? r.json() : Promise.reject(r); }); }
function thumbEl(assetId, label){
  if(assetId) return '<img src="/api/assets/'+assetId+'/file" alt="">';
  return '<span>'+(label||'no ref')+'</span>';
}

function renderRefs(kind){
  var cardsId = kind==="character"?"charCards":"envCards", nId = kind==="character"?"charN":"envN";
  return j("/api/references/"+kind).then(function(d){
    LIB[kind] = d.references || [];
    document.getElementById(nId).textContent = d.count ? "· "+d.count : "";
    var host = document.getElementById(cardsId); host.innerHTML="";
    if(!d.count){ host.innerHTML='<span class="muted">아직 없음 — 아래에서 추가</span>'; return; }
    d.references.forEach(function(r){
      var c = document.createElement("div"); c.className="card"; c.dataset.id=r.id;
      c.innerHTML = '<div class="thumb">'+thumbEl(r.thumb, r.name)+'</div>'+
        '<div class="cap"><div class="nm"></div><div class="ch">v'+r.variants+' · ref'+r.base_refs+'</div></div>';
      c.querySelector(".nm").textContent = r.name || r.id;
      c.onclick = function(){ openDetail(kind, r.id); };
      host.appendChild(c);
    });
  }).catch(function(){ document.getElementById(cardsId).innerHTML='<span class="muted">불러오기 실패</span>'; });
}
function createRef(kind){
  var name=document.getElementById(kind==="character"?"charName":"envName").value.trim();
  var desc=document.getElementById(kind==="character"?"charDesc":"envDesc").value.trim();
  if(!name) return;
  j("/api/references/"+kind,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,description:desc})})
    .then(function(){ document.getElementById(kind==="character"?"charName":"envName").value="";
      document.getElementById(kind==="character"?"charDesc":"envDesc").value=""; renderRefs(kind).then(refreshPickers); });
}

function openDetail(kind, id){
  document.querySelectorAll(".card").forEach(function(c){ c.classList.toggle("sel", c.dataset.id===id); });
  j("/api/references/"+kind+"/"+id).then(function(res){
    var r = res.reference, d = document.getElementById("detail"); d.style.display="block";
    var isChar = kind==="character";
    var variants = (r.variants||[]).map(function(v){
      var attrs = Object.keys(v).filter(function(k){return ["time_of_day","lighting","mood","focus","kind"].indexOf(k)>=0 && v[k];})
        .map(function(k){return k+": "+v[k];}).join(" · ");
      var refimgs = (v.refs||[]).map(function(a){return '<img src="/api/assets/'+a+'/file">';}).join("") || '<span class="noimg"></span>';
      return '<div class="variant"><div class="vh">'+esc(v.label)+'</div><div class="vf">'+esc(v.prompt_fragment||"")+
             (attrs?'  ·  '+esc(attrs):'')+'</div><div class="refs">'+refimgs+'</div></div>';
    }).join("");
    var baseimgs = (r.base_refs||[]).map(function(a){return '<img src="/api/assets/'+a+'/file">';}).join("") || '<span class="muted">없음</span>';
    d.innerHTML =
      '<h2>'+esc(r.name)+' <span class="n">'+kind+' · '+r.id+'</span></h2>'+
      '<div class="muted">'+esc(r.description||"")+'</div>'+
      '<div style="margin:10px 0"><b style="font-size:13px">base refs</b><div class="refs">'+baseimgs+'</div></div>'+
      (isChar?'<div class="form"><button onclick="genSheet(\''+r.id+'\')">캐릭터 시트 생성 (front·profile)</button>'+
              '<input class="grow" id="attachAid" placeholder="ref 에셋 id (ast_…) 첨부"><button class="ghost" onclick="attachRef(\''+kind+'\',\''+r.id+'\')">첨부</button></div>':
              '<div class="form"><input class="grow" id="attachAid" placeholder="ref 에셋 id (ast_…) 첨부"><button class="ghost" onclick="attachRef(\''+kind+'\',\''+r.id+'\')">첨부</button></div>')+
      '<div style="margin-top:12px"><b style="font-size:13px">variants</b><div class="variants">'+(variants||'<span class="muted">없음</span>')+'</div></div>'+
      '<div class="form">'+
        '<input class="grow" id="vLabel" placeholder="변형 라벨 (예: grey knit / dawn)">'+
        '<input class="grow" id="vFrag" placeholder="prompt fragment (예: in a grey knit / cool light)">'+
        '<input class="grow" id="vAttr" placeholder="attrs json (예: {\\"time_of_day\\":\\"dawn\\"})">'+
        '<button onclick="addVariant(\''+kind+'\',\''+r.id+'\')">변형 추가</button>'+
      '</div>';
    d.scrollIntoView({behavior:"smooth", block:"nearest"});
  });
}
function addVariant(kind,id){
  var label=document.getElementById("vLabel").value.trim(); if(!label) return;
  var frag=document.getElementById("vFrag").value.trim();
  var attrs=null; var raw=document.getElementById("vAttr").value.trim();
  if(raw){ try{ attrs=JSON.parse(raw); }catch(e){ alert("attrs json 형식 오류"); return; } }
  j("/api/references/"+kind+"/"+id+"/variant",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({label:label,prompt_fragment:frag,attributes:attrs})})
    .then(function(){ openDetail(kind,id); renderRefs(kind).then(refreshPickers); });
}
function attachRef(kind,id){
  var aid=document.getElementById("attachAid").value.trim(); if(!aid) return;
  j("/api/references/"+kind+"/"+id+"/attach",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({asset_id:aid})})
    .then(function(){ openDetail(kind,id); renderRefs(kind); }).catch(function(){ alert("첨부 실패 (에셋 id 확인)"); });
}
function genSheet(id){
  var b=event.target; b.disabled=true; b.textContent="생성 중…";
  j("/api/references/character/"+id+"/sheet",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({angles:["front view","left profile view"]})})
    .then(function(){ openDetail("character",id); renderRefs("character"); })
    .catch(function(){ b.disabled=false; b.textContent="캐릭터 시트 생성 (실패-provider 확인)"; });
}

// ---- storyboard ----
function optionList(kind){
  return '<option value="">('+kind+' 없음)</option>'+LIB[kind].map(function(r){return '<option value="'+r.id+'">'+esc(r.name||r.id)+'</option>';}).join("");
}
function refreshPickers(){ /* re-render storyboard so pickers reflect the library */ if(PROJECT) renderStoryboard(); }
function renderStoryboard(){
  if(!PROJECT) return;
  document.getElementById("sbPanel").style.display="block";
  document.getElementById("projHint").textContent="project "+PROJECT;
  j("/api/projects/"+PROJECT+"/storyboard").then(function(d){
    document.getElementById("sbN").textContent = d.count?"· "+d.count+" shots":"";
    var host=document.getElementById("sbList");
    if(!d.count){ host.className="muted"; host.textContent="샷이 없습니다 — 아래에서 추가"; return; }
    host.className=""; host.innerHTML="";
    d.shots.forEach(function(s){
      var el=document.createElement("div"); el.className="shot";
      el.innerHTML='<div class="p"></div><div class="meta">'+s.mode+' · '+s.duration+'s'+(s.has_media?' · media✓':'')+
        ' · <a href="#" class="rz">resolve</a></div>'+
        '<div class="bindrow">캐릭터 <select class="selC">'+optionList("character")+'</select>'+
        '환경 <select class="selE">'+optionList("environment")+'</select>'+
        '<button class="ghost bindb">bind</button><span class="bound"></span></div>'+
        '<div class="resolved"></div>';
      el.querySelector(".p").textContent=(s.prompt||"(no prompt)")+(s.caption?"  — caption: "+s.caption:"");
      var rz=el.querySelector(".resolved");
      el.querySelector(".rz").onclick=function(e){ e.preventDefault();
        if(rz.style.display==="block"){ rz.style.display="none"; return; }
        j("/api/projects/"+PROJECT+"/storyboard/"+s.id+"/resolve").then(function(r){
          rz.style.display="block";
          rz.textContent="prompt: "+(r.prompt||"")+"\nreference_images: "+JSON.stringify(r.reference_images)+"\nmode: "+r.mode;
        });
      };
      el.querySelector(".bindb").onclick=function(){
        var cid=el.querySelector(".selC").value, eid=el.querySelector(".selE").value;
        j("/api/projects/"+PROJECT+"/storyboard/"+s.id+"/bind",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({character_id:cid||null, environment_id:eid||null})})
          .then(function(){ el.querySelector(".bound").textContent="바인딩됨 ✓"; });
      };
      host.appendChild(el);
    });
  });
}
function addShot(){
  var prompt=document.getElementById("shotPrompt").value.trim(); if(!prompt) return;
  var dur=parseFloat(document.getElementById("shotDur").value)||4, mode=document.getElementById("shotMode").value;
  j("/api/projects/"+PROJECT+"/storyboard",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt,duration:dur,mode:mode})})
    .then(function(){ document.getElementById("shotPrompt").value=""; renderStoryboard(); });
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

Promise.all([renderRefs("character"), renderRefs("environment")]).then(renderStoryboard);
</script>
</body>
</html>
