<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다봐요 · Watch</title>
<style>
  :root{ --bg:#0b0e16; --fg:#f2f5fb; --muted:#8b93a7; --card:#141926; --line:#232a3b; --accent:#6aa0ff; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --fg:#111726; --muted:#5b647a; --card:#ffffff; --line:#e3e8f2; --accent:#2f6bff; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
        display:flex; flex-direction:column; align-items:center; min-height:100%; padding:24px 16px 40px; }
  header{ width:100%; max-width:960px; display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  header .logo{ font-weight:700; letter-spacing:.02em; }
  header .badge{ font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  .stage{ width:100%; max-width:960px; background:#000; border:1px solid var(--line); border-radius:14px; overflow:hidden;
          box-shadow:0 12px 40px rgba(0,0,0,.35); }
  video{ display:block; width:100%; height:auto; background:#000; aspect-ratio:16/9; }
  .meta{ width:100%; max-width:960px; margin-top:16px; background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:16px 18px; }
  .meta h1{ font-size:18px; margin:0 0 6px; }
  .meta .row{ color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:8px 16px; }
  .meta .attr{ margin-top:10px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; }
  .actions{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
  a.btn{ text-decoration:none; color:var(--fg); border:1px solid var(--line); background:transparent; border-radius:9px;
         padding:8px 14px; font-size:13px; }
  a.btn.primary{ border-color:transparent; background:var(--accent); color:#fff; }
  .empty{ color:var(--muted); text-align:center; max-width:520px; margin-top:60px; }
  #cList{ margin:4px 0 12px; }
  .cmt{ display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px; align-items:baseline; }
  .cmt:first-child{ border-top:0; }
  .cmt .ts{ color:var(--accent); font-variant-numeric:tabular-nums; cursor:pointer; white-space:nowrap; font-size:12.5px; }
  .cmt .who{ color:var(--muted); font-size:12px; }
  .cmt .body{ flex:1; white-space:pre-wrap; word-break:break-word; }
  .crow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .crow input{ flex:1; min-width:120px; background:var(--bg); color:var(--fg); border:1px solid var(--line);
               border-radius:9px; padding:8px 10px; font:inherit; font-size:13px; }
  .empty-c{ color:var(--muted); font-size:13px; padding:6px 0 10px; }
  footer{ margin-top:auto; padding-top:28px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <header>
    <span class="logo">다봐요</span>
    <span class="badge">Watch</span>
  </header>

  <div id="app" class="stage" style="display:none">
    <video id="player" controls playsinline preload="metadata"></video>
  </div>

  <div id="metaBox" class="meta" style="display:none">
    <h1 id="title">—</h1>
    <div class="row" id="rows"></div>
    <div class="attr" id="attr" style="display:none"></div>
    <div class="actions">
      <a class="btn primary" id="dl" download>다운로드</a>
      <a class="btn" id="raw" target="_blank" rel="noopener">원본 열기</a>
    </div>
  </div>

  <div id="commentsBox" class="meta" style="display:none">
    <h1 style="font-size:15px">코멘트 <span id="cCount" style="color:var(--muted);font-weight:400"></span></h1>
    <div id="cList"></div>
    <div class="crow">
      <input id="cName" placeholder="이름(선택)" style="max-width:130px">
      <input id="cText" placeholder="이 시점에 코멘트 남기기…">
      <button id="cAdd" class="btn primary" style="cursor:pointer">현재 시점에 추가</button>
    </div>
  </div>

  <div id="empty" class="empty" style="display:none">
    <h2>영상을 찾을 수 없어요</h2>
    <p>링크의 자산 ID가 올바른지 확인해 주세요.</p>
  </div>

  <footer>Shared read-only · dabwayo studio</footer>

<script>
(function(){
  // asset id from /watch/<id> path or ?v=<id> query
  var parts = location.pathname.replace(/\/+$/,"").split("/");
  var last = parts[parts.length-1];
  var qid = new URLSearchParams(location.search).get("v");
  var id = (qid || (last && last !== "watch" ? last : "")) || "";
  var empty = document.getElementById("empty");
  if(!id){ empty.style.display="block"; return; }
  var PLAYER = null;

  function fmt(t){ t=Math.max(0,t||0); var m=Math.floor(t/60), s=Math.floor(t%60);
    return m+":"+(s<10?"0":"")+s; }
  function renderComments(list){
    var box=document.getElementById("commentsBox"); box.style.display="block";
    document.getElementById("cCount").textContent = list.length ? "· "+list.length : "";
    var host=document.getElementById("cList");
    if(!list.length){ host.innerHTML='<div class="empty-c">아직 코멘트가 없어요. 첫 코멘트를 남겨보세요.</div>'; return; }
    host.innerHTML="";
    list.forEach(function(c){
      var row=document.createElement("div"); row.className="cmt";
      var ts=document.createElement("span"); ts.className="ts"; ts.textContent="["+fmt(c.t)+"]";
      ts.title="이 시점으로 이동"; ts.onclick=function(){ if(PLAYER){ try{PLAYER.currentTime=c.t; PLAYER.play&&PLAYER.play();}catch(e){} } };
      var body=document.createElement("span"); body.className="body";
      var who=document.createElement("span"); who.className="who"; who.textContent=(c.author||"anon")+": ";
      body.appendChild(who); body.appendChild(document.createTextNode(c.text||""));
      row.appendChild(ts); row.appendChild(body); host.appendChild(row);
    });
  }
  function loadComments(){
    fetch("/api/assets/"+encodeURIComponent(id)+"/comments")
      .then(function(r){ return r.ok?r.json():{comments:[]}; })
      .then(function(j){ renderComments(j.comments||[]); })
      .catch(function(){ renderComments([]); });
  }
  function postComment(){
    var text=document.getElementById("cText").value.trim(); if(!text) return;
    var t = PLAYER ? (PLAYER.currentTime||0) : 0;
    var author=document.getElementById("cName").value.trim();
    fetch("/api/assets/"+encodeURIComponent(id)+"/comments",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({t:t, text:text, author:author})
    }).then(function(r){ return r.json(); })
      .then(function(){ document.getElementById("cText").value=""; loadComments(); })
      .catch(function(){});
  }
  document.getElementById("cAdd").addEventListener("click", postComment);
  document.getElementById("cText").addEventListener("keydown", function(e){ if(e.key==="Enter") postComment(); });

  fetch("/api/assets/" + encodeURIComponent(id))
    .then(function(r){ if(!r.ok) throw new Error("not found"); return r.json(); })
    .then(function(a){
      var base = (a.path || "").split(/[\\/]/).pop();
      var url = "/files/" + base;
      var kind = a.kind || "video";
      var player = document.getElementById("player");
      var stage = document.getElementById("app");
      if(kind === "audio"){
        // audio-only asset: swap the video tag for an audio element
        stage.innerHTML = '<audio id="player" controls style="width:100%;display:block"></audio>';
        player = document.getElementById("player");
        stage.style.background = "transparent";
      }
      player.src = url;
      stage.style.display = "block";
      PLAYER = player;
      loadComments();

      var mb = document.getElementById("metaBox"); mb.style.display="block";
      document.getElementById("title").textContent =
        (a.source && a.source.prompt) ? a.source.prompt.slice(0,120)
        : (a.role ? a.role[0].toUpperCase()+a.role.slice(1) : "Untitled") + " · " + id;
      var rows = document.getElementById("rows"); rows.innerHTML = "";
      var bits = [];
      if(a.role) bits.push("role: " + a.role);
      if(a.source && a.source.provider) bits.push("via " + a.source.provider);
      var md = a.media || {};
      if(md.width && md.height) bits.push(md.width + "×" + md.height);
      if(md.duration) bits.push(Math.round(md.duration*10)/10 + "s");
      bits.forEach(function(b){ var s=document.createElement("span"); s.textContent=b; rows.appendChild(s); });

      var attribution = a.source && a.source.params && a.source.params.attribution;
      if(attribution){ var el=document.getElementById("attr"); el.style.display="block"; el.textContent = "♪ " + attribution; }

      document.getElementById("dl").href = url;
      document.getElementById("raw").href = url;
    })
    .catch(function(){ empty.style.display="block"; });
})();
</script>
</body>
</html>
