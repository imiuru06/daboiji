[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dabwayo"
version = "0.1.0"
description = "A small, dependency-free client for the DABWAYO video-generation service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "daboiji" }]
keywords = ["video", "generation", "client", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# No runtime dependencies — standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dabwayo = "dabwayo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
